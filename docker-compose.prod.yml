services:
  postgres:
    environment:
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    command: >
      postgres
      -c ssl=on
      -c ssl_cert_file=/var/lib/postgresql/server.crt
      -c ssl_key_file=/var/lib/postgresql/server.key
      -c log_connections=on
      -c log_disconnections=on
      -c log_statement=ddl
    volumes:
      - pim-pgdata:/var/lib/postgresql/data
      - ./infra/certs/pg-server.crt:/var/lib/postgresql/server.crt:ro
      - ./infra/certs/pg-server.key:/var/lib/postgresql/server.key:ro

  backend:
    environment:
      SPRING_PROFILES_ACTIVE: docker,prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/pim_db?sslmode=require
      PIM_MINIO_ENDPOINT: https://minio:9000

  minio:
    command: server /data --console-address ":9001" --certs-dir /certs
    volumes:
      - pim-minio:/data
      - ./infra/certs/minio:/certs:ro

  nginx:
    image: nginx:alpine
    container_name: pim-nginx
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/certs/tls:/etc/nginx/certs:ro
    networks:
      - frontend-net
    depends_on:
      - frontend
      - backend
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=32M
      - /var/run:size=1M
      - /tmp:size=16M
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.5"

  pg-backup:
    profiles: []

volumes:
  pim-pgdata:
  pim-minio:
  pim-backups:

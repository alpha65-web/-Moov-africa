name: Security Pipeline

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read
  security-events: write
  id-token: write
  packages: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build and test
        run: mvn -B verify -f backend/pom.xml

  sast:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: SpotBugs + Find-Sec-Bugs analysis
        run: mvn -B compile spotbugs:check -f backend/pom.xml
        continue-on-error: true

      - name: Semgrep SAST
        uses: semgrep/semgrep-action@v1
        with:
          config: >-
            p/java
            p/owasp-top-ten
            p/security-audit
        env:
          SEMGREP_RULES: p/java p/owasp-top-ten

  sca:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: OWASP Dependency-Check
        run: mvn -B dependency-check:check -f backend/pom.xml -DfailBuildOnCVSS=9
        continue-on-error: true

      - name: Upload dependency-check report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-check-report
          path: backend/target/dependency-check-report.html

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: backend/
          severity: CRITICAL,HIGH

  secret-scanning:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sbom:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Generate SBOM (CycloneDX)
        run: mvn -B cyclonedx:makeAggregateBom -f backend/pom.xml

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: backend/target/bom.*

  docker-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Hadolint Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: backend/Dockerfile

  container-scan:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t pim-backend:scan backend/

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: pim-backend:scan
          severity: CRITICAL,HIGH
          exit-code: 0

  dast:
    runs-on: ubuntu-latest
    needs: build-and-test
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pim
          POSTGRES_PASSWORD: pim_ci
          POSTGRES_DB: pim_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pim -d pim_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build application JAR
        run: mvn -B package -DskipTests -q -f backend/pom.xml

      - name: Start application
        run: |
          java -jar backend/target/*.jar \
            --spring.profiles.active=dev \
            --spring.datasource.url=jdbc:postgresql://localhost:5432/pim_db \
            --spring.datasource.username=pim \
            --spring.datasource.password=pim_ci \
            > app.log 2>&1 &
          APP_PID=$!
          echo "Waiting for backend (PID $APP_PID) to start..."
          for i in $(seq 1 40); do
            if ! kill -0 $APP_PID 2>/dev/null; then
              echo "Application process died. Logs:"
              cat app.log
              exit 1
            fi
            if curl -sf http://localhost:8092/api/v1/actuator/health; then
              echo ""
              echo "Backend is healthy."
              break
            fi
            if [ $i -eq 40 ]; then
              echo "Backend failed to start within 80s. Logs:"
              tail -100 app.log
              exit 1
            fi
            sleep 2
          done
        env:
          PIM_VAULT_ENABLED: "false"
          SPRING_CLOUD_VAULT_ENABLED: "false"
          PIM_ENCRYPTION_KEY: "ci-test-encryption-key-32chars!!"
          PIM_CLAMAV_ENABLED: "false"
          PIM_DLP_ENABLED: "false"

      - name: OWASP ZAP baseline scan
        uses: zaproxy/action-baseline@v0.14.0
        env:
          ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"
        with:
          target: http://localhost:8092/api/v1/
          rules_file_name: .zap-rules.tsv
          cmd_options: '-a -j'
          allow_issue_writing: false

      - name: Upload ZAP report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-report
          path: report_html.html

  sign-image:
    runs-on: ubuntu-latest
    needs: [container-scan, sast, sca]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: backend/
          push: true
          tags: ghcr.io/${{ github.repository }}/pim-backend:${{ github.sha }}

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign image with cosign (keyless)
        run: cosign sign --yes ghcr.io/${{ github.repository }}/pim-backend@${{ steps.build.outputs.digest }}
        env:
          COSIGN_EXPERIMENTAL: "true"

      - name: Verify signature
        run: |
          cosign verify \
            --certificate-identity-regexp=".*" \
            --certificate-oidc-issuer="https://token.actions.githubusercontent.com" \
            ghcr.io/${{ github.repository }}/pim-backend@${{ steps.build.outputs.digest }}

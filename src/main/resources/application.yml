spring:
  application:
    name: pim
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: jdbc:postgresql://localhost:5432/pim_db
    username: pim
    password: pim_local
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: false
    out-of-order: true

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

server:
  port: 8092
  servlet:
    context-path: /api/v1
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never

pim:
  jwt:
    secret: ${JWT_SECRET:changeme-dev-only-32-chars-minimum!!}
    access-token-expiration: 900000
    refresh-token-expiration: 604800000
  minio:
    endpoint: ${PIM_MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:pim_minio}
    secret-key: ${MINIO_SECRET_KEY:pim_minio_local}
    bucket: pim-media
  cors:
    allowed-origins: ${PIM_CORS_ORIGINS:http://localhost:3000}
  swagger:
    enabled: ${PIM_SWAGGER_ENABLED:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha


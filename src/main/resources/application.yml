spring:
  application:
    name: pim

  datasource:
    url: jdbc:postgresql://localhost:5432/pim_db
    username: pim
    password: pim_local
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  rabbitmq:
    host: localhost
    port: 5672
    username: pim
    password: pim_local

server:
  port: 8092
  servlet:
    context-path: /api/v1

pim:
  jwt:
    secret: ${JWT_SECRET:changeme-dev-only-32-chars-minimum!!}
    access-token-expiration: 900000
    refresh-token-expiration: 604800000
  minio:
    endpoint: http://localhost:9000
    access-key: ${MINIO_ACCESS_KEY:pim_minio}
    secret-key: ${MINIO_SECRET_KEY:pim_minio_local}
    bucket: pim-media

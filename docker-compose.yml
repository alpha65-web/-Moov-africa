services:
  postgres:
    image: postgres:18-alpine
    container_name: pim-postgres
    env_file: .env
    environment:
      POSTGRES_DB: pim_db
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pim-pgdata:/var/lib/postgresql/data
    networks:
      - backend-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d pim_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"

  minio:
    image: minio/minio
    container_name: pim-minio
    command: server /data --console-address ":9001"
    env_file: .env
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    volumes:
      - pim-minio:/data
    networks:
      - backend-net
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 3
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pim-backend
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=128M
      - /app/logs:size=256M
    ports:
      - "8092:8092"
    env_file: .env
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/pim_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      PIM_MINIO_ENDPOINT: http://minio:9000
      PIM_MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      PIM_MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    networks:
      - backend-net
      - frontend-net
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "2.0"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pim-frontend
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=64M
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8092/api/v1
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - frontend-net
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"

  pg-backup:
    image: postgres:18-alpine
    container_name: pim-pg-backup
    env_file: .env
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pim-backups:/backups
    networks:
      - backend-net
    entrypoint: /bin/sh
    command:
      - -c
      - |
        while true; do
          pg_dump -h postgres -U $${POSTGRES_USER} -d pim_db -Fc \
            -f /backups/pim_db_$$(date +%Y%m%d_%H%M%S).dump
          find /backups -name "*.dump" -mtime +7 -delete
          sleep 86400
        done
    depends_on:
      postgres:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.25"
    profiles:
      - backup

  # === Antivirus ===
  clamav:
    image: clamav/clamav:1.3
    container_name: pim-clamav
    volumes:
      - pim-clamav-data:/var/lib/clamav
    networks:
      - backend-net
    healthcheck:
      test: ["CMD", "clamdcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"
    profiles:
      - antivirus

  # === KMS — HashiCorp Vault ===
  vault:
    image: hashicorp/vault:1.17
    container_name: pim-vault
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_DEV_TOKEN:-dev-only-token}
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
    ports:
      - "8200:8200"
    volumes:
      - pim-vault-data:/vault/data
      - ./infra/vault/init.sh:/vault/init.sh:ro
    networks:
      - backend-net
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 10s
      timeout: 5s
      retries: 3
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    profiles:
      - vault

  # === WAF — ModSecurity + OWASP CRS ===
  waf:
    image: owasp/modsecurity-crs:4-nginx-alpine
    container_name: pim-waf
    environment:
      MODSEC_RULE_ENGINE: "On"
      MODSEC_AUDIT_LOG: "/var/log/modsecurity/audit.log"
      MODSEC_AUDIT_LOG_FORMAT: JSON
      MODSEC_REQ_BODY_ACCESS: "On"
      MODSEC_RESP_BODY_ACCESS: "On"
      ANOMALY_INBOUND: "5"
      ANOMALY_OUTBOUND: "4"
      BLOCKING_PARANOIA: "2"
    volumes:
      - ./infra/waf/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./infra/waf/custom-rules.conf:/etc/modsecurity.d/owasp-crs/rules/REQUEST-900-CUSTOM-BEFORE-CRS.conf:ro
    ports:
      - "8080:8080"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - frontend-net
      - backend-net
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
    profiles:
      - waf

  # === Monitoring Stack ===
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: pim-prometheus
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/prometheus/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
      - pim-prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    ports:
      - "9090:9090"
    networks:
      - backend-net
      - monitoring-net
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
    profiles:
      - monitoring

  grafana:
    image: grafana/grafana:11.1.0
    container_name: pim-grafana
    volumes:
      - pim-grafana-data:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3001}
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
    networks:
      - monitoring-net
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    profiles:
      - monitoring

  loki:
    image: grafana/loki:3.1.0
    container_name: pim-loki
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - pim-loki-data:/loki
    ports:
      - "3100:3100"
    networks:
      - backend-net
      - monitoring-net
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    profiles:
      - monitoring

  promtail:
    image: grafana/promtail:3.1.0
    container_name: pim-promtail
    volumes:
      - ./infra/promtail/promtail.yml:/etc/promtail/config.yml:ro
      - /var/log:/var/log:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    networks:
      - backend-net
      - monitoring-net
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.25"
    profiles:
      - monitoring

networks:
  backend-net:
    driver: bridge
    internal: true
  frontend-net:
    driver: bridge
  monitoring-net:
    driver: bridge

volumes:
  pim-pgdata:
  pim-minio:
  pim-backups:
  pim-prometheus-data:
  pim-grafana-data:
  pim-loki-data:
  pim-clamav-data:
  pim-vault-data:

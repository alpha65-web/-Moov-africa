services:
  postgres:
    image: postgres:16
    container_name: pim-postgres
    environment:
      POSTGRES_DB: pim_db
      POSTGRES_USER: pim
      POSTGRES_PASSWORD: pim_local
    ports:
      - "5432:5432"
    volumes:
      - pim-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pim -d pim_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio
    container_name: pim-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: pim_minio
      MINIO_ROOT_PASSWORD: pim_minio_local
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - pim-minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 3

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pim-backend
    ports:
      - "8092:8092"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/pim_db
      SPRING_DATASOURCE_USERNAME: pim
      SPRING_DATASOURCE_PASSWORD: pim_local
      PIM_MINIO_ENDPOINT: http://minio:9000
      PIM_MINIO_ACCESS_KEY: pim_minio
      PIM_MINIO_SECRET_KEY: pim_minio_local
      JWT_SECRET: changeme-dev-only-32-chars-minimum!!
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8092/api/v1/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pim-frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8092/api/v1
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pim-pgdata:
  pim-minio:

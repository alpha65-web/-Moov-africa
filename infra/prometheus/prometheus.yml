global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert-rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

scrape_configs:
  - job_name: 'pim-backend'
    metrics_path: /api/v1/actuator/prometheus
    scrape_interval: 10s
    static_configs:
      - targets: ['backend:8092']
        labels:
          app: pim
          environment: docker

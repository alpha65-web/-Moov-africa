# Custom ModSecurity rules for PIM API
# These run BEFORE the OWASP CRS rules

# Allow JSON content type processing
SecRule REQUEST_HEADERS:Content-Type "@contains application/json" \
    "id:10000,phase:1,pass,nolog,ctl:requestBodyProcessor=JSON"

# Exclude file upload endpoints from request body inspection (binary content)
SecRule REQUEST_URI "@beginsWith /api/v1/media" \
    "id:10001,phase:1,pass,nolog,ctl:requestBodyAccess=Off"

# Exclude Prometheus metrics endpoint
SecRule REQUEST_URI "@streq /api/v1/actuator/prometheus" \
    "id:10002,phase:1,pass,nolog,allow"

# Block requests with suspicious user-agents (scanners, bots)
SecRule REQUEST_HEADERS:User-Agent "@pmFromFile /etc/modsecurity.d/owasp-crs/rules/scanners-user-agents.data" \
    "id:10010,phase:1,deny,status:403,log,msg:'Blocked scanner/bot user-agent'"

# Block access to sensitive paths
SecRule REQUEST_URI "@rx (?i)\.(env|git|svn|htaccess|htpasswd|bak|old|swp|config)$" \
    "id:10020,phase:1,deny,status:403,log,msg:'Blocked access to sensitive file'"

# IP reputation: block after repeated violations (10 in 60s)
SecAction "id:10030,phase:1,pass,nolog,initcol:ip=%{REMOTE_ADDR}"
SecRule IP:REPUT_BLOCK_FLAG "@eq 1" \
    "id:10031,phase:1,deny,status:403,log,msg:'IP temporarily blocked after repeated violations'"
SecRule TX:ANOMALY_SCORE "@ge 5" \
    "id:10032,phase:5,pass,setvar:ip.reput_block_flag=1,expirevar:ip.reput_block_flag=300"

# Log all blocked requests for SIEM integration
SecRule RESPONSE_STATUS "@rx ^(403|444)$" \
    "id:10040,phase:5,pass,log,msg:'WAF blocked request',logdata:'%{REQUEST_URI} from %{REMOTE_ADDR}'"
